<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mia and the Magic Garden · English Quest</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Trebuchet MS','Segoe UI',Tahoma,system-ui,sans-serif;
    color:#2b2140;
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:120px;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- ФОН ---------- */
  #bg{
    position:fixed;inset:0;z-index:-3;
    background:linear-gradient(180deg,#a8e0ff 0%,#d6f3ff 45%,#e9fff2 100%);
    transition:background 1.4s ease;
  }
  #stars{position:fixed;inset:0;z-index:-2;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation:twinkle 3s infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}

  #meadow{position:fixed;bottom:0;left:0;width:100%;height:24vh;z-index:-1;pointer-events:none;opacity:.85;transition:opacity 1.4s ease}
  #meadow svg{width:100%;height:100%;display:block}
  #flowers{position:fixed;bottom:0;left:0;width:100%;height:24vh;z-index:-1;pointer-events:none}
  .flower{position:absolute;bottom:0;opacity:0;transform:translateY(24px) scale(.6);transition:.8s cubic-bezier(.2,.9,.3,1.4);filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
  .flower.show{opacity:1;transform:translateY(0) scale(1)}

  /* ---------- HUD ---------- */
  #hud{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:14px;
    padding:12px 18px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.8);
  }
  .brand{font-weight:800;color:#6a4fa0;font-size:15px;white-space:nowrap}
  .progress{flex:1;height:12px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
  #bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8bd3ff,#c39bff,#ffb3d1);transition:width .5s ease}
  #soundBtn{
    font-size:18px;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;box-shadow:0 4px 12px rgba(110,80,170,.18);
  }

  /* ---------- КАРТОЧКА ---------- */
  #stage{display:flex;justify-content:center;padding:26px 16px 60px}
  .card{
    width:100%;max-width:880px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:30px;
    padding:26px 30px 22px;
    box-shadow:0 24px 60px rgba(80,50,140,.18), 0 0 0 1px rgba(255,255,255,.85) inset;
    border:2px solid rgba(255,255,255,.95);
    animation:cardIn .65s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.975)}to{opacity:1;transform:none}}

  .scene{
    text-align:center;font-size:54px;line-height:1.2;letter-spacing:4px;margin-bottom:6px;
    filter:drop-shadow(0 8px 14px rgba(120,80,180,.25));
    animation:floaty 4.5s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  .title{font-size:21px;color:#6a4fa0;margin-bottom:16px;text-align:center;font-weight:800;letter-spacing:.3px}

  .story{font-size:20px;line-height:2.9;color:#33264d}
  @media(max-width:620px){.story{font-size:17px;line-height:2.8}}

  /* ---------- ПРОПУСКИ ---------- */
  .blank{
    display:inline-block;position:relative;
    min-width:78px;padding:3px 10px;margin:6px 3px;
    border-radius:11px;border:2px dashed #b39ddb;
    background:#f4eeff;color:#8b6fd0;
    font-weight:800;text-align:center;cursor:pointer;
    transition:transform .15s,background .2s,border-color .2s;
    vertical-align:middle;user-select:none;
  }
  .blank:hover{background:#e9dcff;transform:translateY(-2px)}
  .blank.ok{
    border:2px solid #46b96a;border-style:solid;
    background:#e8faee;color:#268a4a;cursor:default;transform:none;
  }
  .blank.bad{animation:shake .4s;border-color:#ec7a7a;background:#fff0f0}

  .input-wrap{display:inline-block;position:relative;margin:6px 3px;vertical-align:middle}
  .blank-input{
    width:10.5ch;font:inherit;font-weight:800;font-size:19px;
    color:#6a4fa0;text-align:center;
    background:#f7f2ff;border:2px dashed #b39ddb;border-radius:11px;
    padding:3px 6px;outline:none;transition:.2s;
  }
  .blank-input:focus{border-color:#8e6fd8;background:#fff;box-shadow:0 0 0 4px rgba(142,111,216,.16)}
  .blank-input.ok{border:2px solid #46b96a;border-style:solid;background:#e8faee;color:#268a4a}
  .blank-input.bad{animation:shake .4s;border-color:#ec7a7a;background:#fff0f0}

  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)}
    60%{transform:translateX(-5px)}
    80%{transform:translateX(5px)}
  }

  /* ---------- ПОПОВЕР (всегда поверх всего) ---------- */
  .pop{
    position:fixed;left:0;top:0;
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    padding:9px;background:#fff;border-radius:16px;
    box-shadow:0 16px 40px rgba(70,40,130,.35), 0 0 0 1px rgba(180,150,240,.25);
    z-index:99999;
    max-width:92vw;
    transform:translateX(-50%);
    animation:popIn .18s ease;
    transform-origin:top center;
  }
  @keyframes popIn{
    from{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.92)}
    to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  }
  .pop button{
    font:inherit;font-weight:800;font-size:17px;
    padding:9px 15px;border-radius:12px;border:none;cursor:pointer;
    background:#f1eaff;color:#5b3fa0;transition:.15s;
  }
  .pop button:hover{background:#e0d2ff;transform:translateY(-2px)}
  .pop button.wrong{background:#ffe0e0;color:#c0392b;animation:shake .4s}

  /* ---------- НИЗ КАРТОЧКИ ---------- */
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
  .primary{
    font:inherit;font-weight:900;font-size:17px;
    padding:13px 28px;border-radius:16px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#8e6fd8,#c39bff);
    color:#fff;box-shadow:0 10px 22px rgba(142,111,216,.42);
    transition:.2s;
  }
  .primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .primary:not(:disabled){animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .ghost{
    font:inherit;font-size:15px;font-weight:700;padding:11px 18px;border-radius:14px;
    border:2px solid #ddd0ff;background:#fff;color:#6a4fa0;cursor:pointer;transition:.2s;
  }
  .ghost:hover{background:#f6f0ff}

  .translation{
    margin-top:16px;padding:14px 18px;border-radius:16px;
    background:#f7f3ff;color:#5c4a80;font-size:16px;line-height:1.75;
    border-left:4px solid #c9b6ff;
    animation:cardIn .35s ease;
  }
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="bg"></div>
<div id="stars"></div>
<div id="meadow">
  <svg viewBox="0 0 1440 320" preserveAspectRatio="none">

/* =========================================================
   ОТПРАВКА РЕЗУЛЬТАТА В GOOGLE FORMS
   ========================================================= */
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScsr7Hl29roXcVcOi83SrIUStb3U8eqyj2PU8tQAjIFb6izCQ/viewform";

function sendResult(name, correct, total, mistakes, time) {
  const data = new URLSearchParams();
  data.append("entry.1381672458", name);        // поле "Имя"
  data.append("entry.1686545992", correct);     // поле "Правильных"
  data.append("entry.1003227158", total);       // поле "Всего"
  data.append("entry.1445414322", mistakes);    // поле "Ошибки"
  data.append("entry.1324949148", time);        // поле "Время"

  fetch(FORM_URL + "?" + data.toString(), {
    method: "GET",
    mode: "no-cors"
  }).catch(() => { /* no-cors — ответ всё равно не виден */ });
}

function registerMistake(slideIdx) {
  mistakeSet.add(slideIdx + 1);      // нумерация с 1
}

function formatTime(ms) {
  const sec = Math.round(ms / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m > 0) return `${m} мин ${s} сек`;
  return `${s} сек`;
}

/* =========================================================
   ЗВУКИ
   ========================================================= */
let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.06, delay = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const goodSound = () => { beep(880, .12, 'sine', .07); beep(1320, .18, 'sine', .06, .1); };
const badSound  = () => { beep(200, .2, 'square', .05); };

};

})();

/* =========================================================
   ЛОГИКА ПРОПУСКОВ
   ========================================================= */
function buildText(text, blanks) {
  const frag = document.createDocumentFragment();
  text.split(/(\{\d+\})/g).forEach(part => {
    const m = /^\{(\d+)\}$/.exec(part);
    if (m) frag.appendChild(makeBlank(blanks[+m[1]]));
    else if (part) frag.appendChild(document.createTextNode(part));
  });
  return frag;
}

function makeBlank(b) {
  if (b.type === 'input') {
    const wrap = document.createElement('span');
    wrap.className = 'input-wrap';
    const inp = document.createElement('input');
    inp.className = 'blank-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.setAttribute('autocapitalize', 'off');
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); checkInput(inp, b); }
    });
    inp.addEventListener('blur', () => { if (inp.value.trim()) checkInput(inp, b); });
    wrap.appendChild(inp);
    return wrap;
  }

  const el = document.createElement('span');
  el.className = 'blank';
  el.textContent = '____';
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (el.classList.contains('ok')) return;
    openPopover(el, b);
  });
  return el;
}

function checkInput(inp, b) {
  if (inp.classList.contains('ok')) return;
  const val = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!val) return;

  if (val === b.a.toLowerCase()) {
    inp.classList.remove('bad');
    inp.classList.add('ok');
    inp.readOnly = true;
    inp.blur();
    solvedTotal++;
    updateProgress();
    goodSound();
    checkSlideDone();
  } else {
    inp.classList.add('bad');
    badSound();
    registerMistake(cur);
    setTimeout(() => inp.classList.remove('bad'), 500);
  }
}

/* =========================================================
   ПОПОВЕР: рендерится в body, position:fixed, всегда сверху
   ========================================================= */
function openPopover(anchor, b) {
  closePopover();

  const pop = document.createElement('div');
  pop.className = 'pop';

  b.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = opt;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (opt.toLowerCase() === b.a.toLowerCase()) {
        anchor.textContent = opt;
        anchor.classList.remove('bad');
        anchor.classList.add('ok');
        closePopover();
        solvedTotal++;
        updateProgress();
        goodSound();
        checkSlideDone();
      } else {
        btn.classList.add('wrong');
        anchor.classList.add('bad');
        badSound();
        registerMistake(cur);
        setTimeout(() => {
          btn.classList.remove('wrong');
          anchor.classList.remove('bad');
        }, 500);
      }
    });
    pop.appendChild(btn);
  });

  // сначала прячем за экран, чтобы измерить размеры
  pop.style.left = '-9999px';
  pop.style.top  = '-9999px';
  document.body.appendChild(pop);
  openPop = pop;

  positionPopover(pop, anchor);

  // если пользователь прокрутил/изменил размер — привязка «уплывает», закрываем
  window.addEventListener('scroll', closePopover, { passive: true, once: true });
  window.addEventListener('resize', closePopover, { once: true });
}

function positionPopover(pop, anchor) {
  const margin = 8;
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth;
  const ph = pop.offsetHeight;

  const half = pw / 2;
  let left = r.left + r.width / 2;
  left = Math.max(half + margin, Math.min(window.innerWidth - half - margin, left));

  let top = r.bottom + margin;
  if (top + ph > window.innerHeight - margin) {
    const above = r.top - ph - margin;
    if (above >= margin) top = above;
    else top = Math.max(margin, window.innerHeight - ph - margin);
  }

  pop.style.left = left + 'px';
  pop.style.top  = top + 'px';
}

function closePopover() {
  if (openPop) { openPop.remove(); openPop = null; }
}
document.addEventListener('click', closePopover);

/* =========================================================
   ПРОГРЕСС И ПРОВЕРКА СЛАЙДА
   ========================================================= */
function updateProgress() {
  barEl.style.width = (solvedTotal / totalBlanks * 100) + '%';
}

let slideRewarded = false;

function checkSlideDone() {
  const items = storyEl.querySelectorAll('.blank, .blank-input');
  const done = Array.from(items).every(e => e.classList.contains('ok'));
  if (done) {
    nextBtn.disabled = false;
    if (!slideRewarded) {
      slideRewarded = true;
      const flower = flowersEl.children[cur];
      if (flower) flower.classList.add('show');
      setTimeout(winSound, 150);
    }
  }
}

/* =========================================================
   РЕНДЕР СЛАЙДА
   ========================================================= */
function renderSlide(i) {
  closePopover();
  const s = SLIDES[i];
  slideRewarded = false;

  bgEl.style.background = s.bg;
  starsEl.style.opacity = s.stars;
  meadowEl.style.opacity = (0.35 + 0.5 * (1 - s.stars)).toFixed(2);

  sceneEl.textContent = s.scene;
  titleEl.textContent = s.title;

  storyEl.innerHTML = '';
  storyEl.appendChild(buildText(s.text, s.blanks));

  transEl.textContent = s.ru;
  transEl.classList.add('hidden');
  trBtn.textContent = '🇷🇺 Перевод';

  nextBtn.disabled = true;
  nextBtn.textContent = (i === SLIDES.length - 1) ? 'Финиш ✨' : 'Дальше →';

  cardEl.classList.remove('hidden');
  finalEl.classList.add('hidden');

  cardEl.style.animation = 'none';
  void cardEl.offsetWidth;
  cardEl.style.animation = '';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   ФИНАЛ + отправка результата
   ========================================================= */
function showFinal() {
  closePopover();
  cardEl.classList.add('hidden');
  finalEl.classList.remove('hidden');
  bgEl.style.background = 'linear-gradient(180deg,#2b2450 0%,#4b3f7a 45%,#7a6bb0 100%)';
  starsEl.style.opacity = 1;
  meadowEl.style.opacity = 0.35;

  const elapsed = formatTime(Date.now() - startTime);
  const mistakesList = [...mistakeSet].sort((a,b) => a - b).join(", ");
  const mistakesText = mistakesList || "нет";

  finalEl.innerHTML = `
    <div class="scene">🏆🧚‍♀️✨</div>
    <h1 class="title">You did it! · Ты справилась!</h1>
    <p class="story" style="text-align:center;line-height:1.9">
      Mia is safe, the magic box is back, and the garden is full of light.<br>
      Ты прошла всю историю и разгадала все пропуски —
      <b>${totalBlanks} из ${totalBlanks}</b>! 🌟<br>
      <span style="font-size:17px;color:#6a4fa0">Ты теперь знаешь: lady → ladies, man → men, box → boxes,
      near / on / in / under, числа до 60 и вторую форму глаголов.</span>
    </p>
    <div class="card-foot" style="justify-content:center">
      <button class="primary" id="againBtn">Играть снова 🔄</button>
    </div>
  `;

  document.getElementById('againBtn').addEventListener('click', () => location.reload());
  winSound();

  if (!resultSent) {
    resultSent = true;
    sendResult(PLAYER_NAME, solvedTotal, totalBlanks, mistakesText, elapsed);
  }
}

/* =========================================================
   КНОПКИ
   ========================================================= */
nextBtn.addEventListener('click', () => {
  if (cur < SLIDES.length - 1) {
    cur++;
    renderSlide(cur);
  } else {
    showFinal();
  }
});

trBtn.addEventListener('click', () => {
  const hidden = transEl.classList.toggle('hidden');
  trBtn.textContent = hidden ? '🇷🇺 Перевод' : '🇷🇺 Скрыть перевод';
});

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
});

/* =========================================================
   СТАРТ
   ========================================================= */
updateProgress();
renderSlide(0);
</script>
</body>
</html>
